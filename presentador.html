<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <title>Vista de presentador · Plazo fijo</title>
  </head>
  <body>
    <!-- Vista de presentador: se abre por URL en el segundo monitor y controla la presentación por BroadcastChannel. -->
    <div class="presentador">
      <header class="barra">
        <p class="barra-titulo t-title-md">Plazo fijo · Vista de presentador</p>

        <label class="selector">
          <span class="visualmente-oculto">Ir a la diapositiva</span>
          <select class="t-label-lg" id="selector"></select>
        </label>

        <div class="barra-grupo" role="group" aria-label="Temporizador">
          <span class="barra-etiqueta t-label-md">Tiempo</span>
          <span class="reloj t-headline-sm" id="temporizador" aria-live="off">00:00</span>
          <button class="boton boton-primario t-label-lg" id="temporizador-alternar" type="button">Iniciar</button>
          <button class="boton boton-secundario t-label-lg" id="temporizador-reiniciar" type="button">Reiniciar</button>
        </div>

        <div class="barra-grupo">
          <span class="barra-etiqueta t-label-md">Hora</span>
          <span class="reloj t-headline-sm" id="hora">--:--:--</span>
        </div>
      </header>

      <main class="columnas">
        <!-- Izquierda: lo que ve el público (la vista grande se puede usar en las slides con prototipo). -->
        <section class="panel panel-vista" aria-label="Vista del público">
          <div class="miniatura-zona">
            <div class="miniatura">
              <iframe id="miniatura" title="Slide actual (lo que ve el público)"></iframe>
            </div>
          </div>

          <nav class="vecinas" aria-label="Navegación de slides">
            <button class="vecina" id="anterior" type="button">
              <span class="vecina-vista"><iframe id="vista-anterior" title="Slide anterior" tabindex="-1" aria-hidden="true"></iframe></span>
              <span class="vecina-etiqueta t-label-md">← Anterior</span>
            </button>
            <button class="vecina" id="siguiente" type="button">
              <span class="vecina-vista"><iframe id="vista-siguiente" title="Slide siguiente" tabindex="-1" aria-hidden="true"></iframe></span>
              <span class="vecina-etiqueta t-label-md">Siguiente →</span>
            </button>
          </nav>
          <p class="visualmente-oculto" id="indicador" aria-live="polite"></p>
        </section>

        <!-- Derecha: guion de la slide actual. -->
        <section class="panel panel-notas" aria-labelledby="notas-titulo">
          <header class="notas-cabecera">
            <h1 class="t-title-lg" id="notas-titulo">Notas del orador</h1>
            <div class="notas-tamano" role="group" aria-label="Tamaño del texto">
              <button class="boton boton-secundario t-label-lg" id="texto-menos" type="button" aria-label="Achicar texto">A−</button>
              <button class="boton boton-secundario t-label-lg" id="texto-mas" type="button" aria-label="Agrandar texto">A+</button>
            </div>
          </header>
          <div class="notas" id="notas" tabindex="0"></div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/presentador/presentador.js"></script>
  </body>
</html>
